name: Flutter CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.x', channel: stable }
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze
      - run: cd app && flutter test
      - run: cd app && flutter build apk --release --split-per-abi
      - name: APK size check
        run: |
          SIZE=$(stat -c%s app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "arm64 APK: $SIZE bytes"
          if [ $SIZE -gt 20971520 ]; then
            echo "::warning::APK exceeds 20 MB target"
          fi
