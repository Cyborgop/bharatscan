// Flutter Android app build config — BharatScan
// Target: Android 10+ (API 29), NNAPI available

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.bharatscan.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.bharatscan.app"
        minSdk 29           // Android 10, NNAPI ~stable
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            // APK size optimization
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug  // TODO: real signing for Play Store
        }
    }

    // split APKs by ABI — reduces per-device download size
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include 'armeabi-v7a', 'arm64-v8a'
    //         universalApk false
    //     }
    // }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}
