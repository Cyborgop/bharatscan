name: bharatscan
description: Offline-first document scanner for India.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ML runtime
  tflite_flutter: ^0.12.1

  # Camera + image
  camera: ^0.10.6
  image: ^4.1.7
  path_provider: ^2.1.2

  # Storage
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.0+4

  # PDF + share
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2

  # Utilities
  cupertino_icons: ^1.0.6
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/corner_detector_int8.tflite
    # - assets/models/doc_classifier_int8.tflite
    # - assets/models/text_det_int8.tflite
    # - assets/models/text_rec_devanagari_int8.tflite
    # - assets/models/manifest.json

  fonts:
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
